# Local-first Neo4j Community service for ZEP_MODE=graphiti runs.
#
# Neo4j Community is Graphiti's most mature backend and the one with the
# deepest production track record. GPLv3 on the database side composes
# cleanly with this repository's AGPLv3 application license. The Cypher we emit through GraphitiAudienceStore is portable
# to any Cypher-speaking backend (Aura, self-hosted Enterprise) if a
# user later migrates off Community.
#
# Security posture:
#   * Ports are bound to 127.0.0.1 (loopback only) -- never 0.0.0.0. The
#     Neo4j browser (7474) and Bolt (7687) endpoints are intentionally
#     unreachable from other hosts on the LAN. If you need remote access,
#     tunnel over SSH; do not edit this file to expose the ports.
#   * NEO4J_PASSWORD is REQUIRED (no default). Compose fails-closed with
#     a clear error if it is unset. A shared local default would leak into
#     deployment configs when copy-pasted and give a false sense that the
#     box is locked when every developer used the same string.
#
# Usage:
#   cd backend
#   export NEO4J_PASSWORD='choose-something-not-in-this-repo'
#   docker compose up -d neo4j-community
#   uv pip install 'graphiti-core>=0.29,<0.30'   # see pyproject.toml NOTE
#   export ZEP_MODE=graphiti
#   export NEO4J_URI=bolt://localhost:7687
#   export NEO4J_USER=neo4j
#   # NEO4J_PASSWORD already exported above
#
# Any deployment beyond a single-developer laptop must (a) keep the
# 127.0.0.1 binding (or front Neo4j with an authenticated reverse proxy),
# (b) issue a strong, environment-specific NEO4J_PASSWORD, and (c) treat
# Bolt as an internal-only protocol.

services:
  neo4j-community:
    image: neo4j:5-community
    container_name: rawfish-neo4j
    # 7474 = HTTP browser UI (handy for ad-hoc Cypher); 7687 = Bolt (the
    # protocol graphiti-core connects over). Both bound to loopback only
    # -- see header block for why.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      # NEO4J_PASSWORD must be set in the shell environment; the `:?...`
      # syntax tells compose to abort with the message rather than
      # substitute an empty string (which Neo4j would then accept as
      # "disable auth" -- exactly the failure mode we are preventing).
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set; do not use the dev default for any non-local environment}"
      # Accept the Community license non-interactively so the container
      # boots on a fresh laptop without a TTY prompt.
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      # Named volume so /data survives `docker compose down` -- without
      # this every restart wipes the graph, defeating the
      # local-persistence point of running graphiti locally.
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      # cypher-shell ships in the Neo4j image; an empty `RETURN 1` is a
      # cheap liveness probe that also proves auth + Bolt are up. The
      # password is derived from NEO4J_AUTH inside the container. Do not
      # add a separate NEO4J_PASSWORD container env var: Neo4j treats all
      # NEO4J_* variables as config keys and rejects PASSWORD.
      test:
        - "CMD-SHELL"
        - "pass=\"$${NEO4J_AUTH#neo4j/}\"; cypher-shell -u neo4j -p \"$$pass\" 'RETURN 1' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j-data:
  neo4j-logs:
