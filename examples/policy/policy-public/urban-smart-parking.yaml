persona: policy
scope: public_policy
title: "Paid smart-parking rollout in the commercial core of a tier-2 Indian city"
summary: >
  Synthesized scenario. A tier-2 Indian city (population ~1.2 million)
  proposes a paid smart-parking system in its central commercial wards
  using sensor-equipped bays, a public app, and a private operator
  contracted for collection and enforcement. Goal: surface equity and
  enforcement failure modes before the gazette notification is issued.
jurisdiction: "Municipal corporation; state-level transport rules apply"
seed_text: |
  Draft gazette notification:

  1. The municipal corporation shall introduce time-bound paid parking in
     designated commercial wards (Wards 14, 15, 18, 22) effective 90 days
     from this notification. Rates: INR 20/hour for cars, INR 10/hour for
     two-wheelers, with a free 15-minute grace window.

  2. Bays are sensor-equipped; payment via the city app, UPI, or attended
     kiosk. The first 30 minutes are free for two-wheelers in identified
     vending zones.

  3. A private operator (selected via tender) handles meter maintenance,
     payment collection, and ticketing. Revenue share: 65% to municipal
     corporation, 35% to operator, with a clawback for under-performance
     against an uptime SLA.

  4. Enforcement: automated camera-based ticketing with a 7-day grievance
     window. Repeat non-payment after three notices triggers towing.

  5. Auto-rickshaws using designated stands are exempt. Delivery vehicles
     get a per-stop 10-minute grace; aggregator partnerships TBD.
stress_question: "Where does this fail on equity and how is enforcement gamed?"
clauses:
  - clause_id: c1
    text: "Paid bays in Wards 14, 15, 18, 22 with INR 20/hr cars, INR 10/hr two-wheelers."
    affects: [citizen_segment, business_segment, intermediary]
  - clause_id: c2
    text: "Private operator with 65/35 revenue share and uptime-based clawback."
    affects: [implementing_agency, business_segment, civil_society_actor]
  - clause_id: c3
    text: "Camera-based automated ticketing with 7-day grievance window."
    affects: [citizen_segment, regulator, media_actor]
  - clause_id: c4
    text: "Auto-rickshaw stand exemption; delivery 10-minute grace."
    affects: [service_provider, intermediary, business_segment]
stakeholders:
  - segment_id: s_shops
    name: "Shop owners in the four commercial wards"
    type: business_segment
    interests: ["customer footfall", "predictable kerbside access"]
    incentives: ["bay turnover may help walk-in customers"]
    constraints: ["fear that paid parking suppresses casual visits"]
    likely_support_reasons: ["currently lose bays to all-day private commuter parking"]
    likely_opposition_reasons: ["customers may shift to mall parking which is free"]
    information_channels: ["traders association", "local press", "WhatsApp groups"]
    influence_level: 4
    vulnerability_level: 3
    compliance_propensity: 3
    trust_level: 2
    mobilization_capacity: 4
    what_changes_their_mind:
      - "ward-level footfall data after 90 days showing turnover gains"
      - "validated parking discount linked to receipts above INR 500"
  - segment_id: s_residents
    name: "Residents abutting the commercial wards"
    type: citizen_segment
    interests: ["overspill onto residential lanes prevented"]
    incentives: ["potential reduction in chaotic kerbside parking"]
    constraints: ["no enforcement budget allocated for adjacent residential streets"]
    likely_support_reasons: ["less honking, less double parking"]
    likely_opposition_reasons: ["displaced commuter parking floods their lanes"]
    information_channels: ["resident welfare association", "local press"]
    influence_level: 3
    vulnerability_level: 4
    compliance_propensity: 4
    trust_level: 3
    mobilization_capacity: 3
    what_changes_their_mind:
      - "a parallel residential-permit scheme for adjacent lanes"
  - segment_id: s_commuters
    name: "Daily commuters who park in the commercial wards"
    type: burdened_group
    interests: ["lowest possible commute cost"]
    incentives: ["none; this is a new cost"]
    constraints: ["limited public transit alternatives at peak hours"]
    likely_support_reasons: ["sensor app reduces hunting time"]
    likely_opposition_reasons: ["INR 160 for an 8-hour workday is a real burden"]
    information_channels: ["app reviews", "twitter complaints", "local talk radio"]
    influence_level: 3
    vulnerability_level: 5
    compliance_propensity: 3
    trust_level: 2
    mobilization_capacity: 4
    what_changes_their_mind:
      - "a daily cap (e.g. INR 80) for vehicles parked >4 hours"
      - "a frequent-parker pass tied to employer attestation"
  - segment_id: s_auto
    name: "Auto-rickshaw drivers and their unions"
    type: service_provider
    interests: ["protected stand access", "no harassment by camera ticketing"]
    incentives: ["stand exemption already in the draft"]
    constraints: ["camera systems often misclassify stationary autos as illegally parked"]
    likely_support_reasons: ["explicit stand exemption"]
    likely_opposition_reasons: ["enforcement edge cases create harassment patterns"]
    information_channels: ["union meetings", "local press"]
    influence_level: 3
    vulnerability_level: 4
    compliance_propensity: 2
    trust_level: 2
    mobilization_capacity: 5
    what_changes_their_mind:
      - "a written SOP that camera tickets at designated stands are auto-voided"
  - segment_id: s_delivery
    name: "Last-mile delivery workers (gig and employed)"
    type: burdened_group
    interests: ["10-minute grace honoured in practice"]
    incentives: ["faster bay search via app"]
    constraints: ["aggregator pay model penalises delay"]
    likely_support_reasons: ["grace window protects their economics"]
    likely_opposition_reasons: ["camera enforcement misclassifies short stops"]
    information_channels: ["aggregator app notifications", "worker collectives"]
    influence_level: 2
    vulnerability_level: 5
    compliance_propensity: 3
    trust_level: 2
    mobilization_capacity: 3
    what_changes_their_mind:
      - "aggregators sign an MOU to dispute false tickets on workers' behalf"
  - segment_id: s_traffic
    name: "Municipal traffic police"
    type: implementing_agency
    interests: ["clear chain of authority for enforcement"]
    incentives: ["less ad-hoc kerbside dispute resolution"]
    constraints: ["towing capacity limited; grievance window adds workload"]
    likely_support_reasons: ["automated system reduces discretionary stops"]
    likely_opposition_reasons: ["camera errors become their problem to defend"]
    information_channels: ["internal directives", "media briefings"]
    influence_level: 4
    vulnerability_level: 2
    compliance_propensity: 4
    trust_level: 3
    mobilization_capacity: 3
    what_changes_their_mind:
      - "a clear SOP separating camera tickets from on-foot discretion"
  - segment_id: s_operator
    name: "Private parking operator (contracted)"
    type: business_segment
    interests: ["meter uptime above SLA", "ticket collection efficiency"]
    incentives: ["35% revenue share + uptime clawback structure"]
    constraints: ["sensor reliability in monsoon; vandalism risk"]
    likely_support_reasons: ["clear contract economics"]
    likely_opposition_reasons: ["clawback triggers if monsoon downtime spikes"]
    information_channels: ["operator helpdesk", "contract review meetings"]
    influence_level: 3
    vulnerability_level: 2
    compliance_propensity: 4
    trust_level: 3
    mobilization_capacity: 2
    what_changes_their_mind:
      - "an explicit monsoon-downtime force majeure clause in the contract"
assumptions:
  - "Sensor uptime can be sustained above 90% across non-monsoon months"
  - "The city app supports UPI and an attended-kiosk fallback for non-app users"
  - "Auto-rickshaw stand boundaries are visibly marked and known to camera vendors"
success_criteria:
  - "Average bay turnover in Wards 14, 15, 18, 22 increases by >30% within 6 months"
  - "Grievance-window upheld rate (in favour of citizens) tracked and published monthly"
  - "No sustained protest cycle longer than 14 days from any single stakeholder segment"
failure_modes_to_watch:
  - "Commuters displace into residential lanes and trigger a resident-led backlash"
  - "Camera tickets misclassify auto-rickshaw stands and unions strike"
  - "Delivery workers eat ticket cost out of their own pay and a media story breaks"
  - "Operator uptime falls in monsoon and clawback dispute lands in court"
  - "Shop-owner footfall data is contested and weaponised by traders association"
  - "Grievance window backlog grows beyond 7 days and erodes trust in the system"
